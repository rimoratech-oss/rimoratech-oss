<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Rimora: automation, karyawan AI, dan skill siap pakai untuk bisnis">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#13233F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#glow)"/>

  <!-- Text block: 96px left margin, vertically centred on y=160 -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="96" y="68" width="56" height="6" rx="3" fill="url(#accent)"/>
    <text x="92" y="156" font-size="80" font-weight="700" fill="#F8FAFC" letter-spacing="-2">Rimora</text>
    <text x="96" y="212" font-size="28" font-weight="400" fill="#CBD5E1">Automation, karyawan AI, dan skill</text>
    <text x="96" y="248" font-size="28" font-weight="400" fill="#CBD5E1">siap pakai untuk bisnis.</text>
  </g>

  <!-- Workflow motif: right side, 96px right margin, centred on y=160 -->
  <g stroke="#2DD4BF" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M864 100 C 934 100, 944 160, 1014 160"/>
    <path d="M864 220 C 934 220, 944 160, 1014 160"/>
    <path d="M1014 160 C 1074 160, 1084 100, 1144 100"/>
    <path d="M1014 160 C 1074 160, 1084 220, 1144 220"/>
  </g>
  <g fill="#0B1220" stroke-width="2">
    <rect x="824" y="80" width="40" height="40" rx="10" stroke="#60A5FA"/>
    <rect x="824" y="200" width="40" height="40" rx="10" stroke="#60A5FA"/>
    <rect x="990" y="136" width="48" height="48" rx="12" stroke="url(#accent)" stroke-width="3"/>
    <rect x="1144" y="80" width="40" height="40" rx="10" stroke="#2DD4BF"/>
    <rect x="1144" y="200" width="40" height="40" rx="10" stroke="#2DD4BF"/>
  </g>
  <circle cx="1014" cy="160" r="8" fill="url(#accent)"/>
  <circle cx="844" cy="100" r="5" fill="#60A5FA"/>
  <circle cx="844" cy="220" r="5" fill="#60A5FA"/>
  <circle cx="1164" cy="100" r="5" fill="#2DD4BF"/>
  <circle cx="1164" cy="220" r="5" fill="#2DD4BF"/>
</svg>
