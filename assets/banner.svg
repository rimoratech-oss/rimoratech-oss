<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Rimora: automation, karyawan AI, dan skill siap pakai" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#13233F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#glow)"/>
  <!-- workflow network motif -->
  <g stroke="#2DD4BF" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M880 100 C 950 100, 960 160, 1030 160"/>
    <path d="M880 220 C 950 220, 960 160, 1030 160"/>
    <path d="M1030 160 C 1090 160, 1100 90, 1160 90"/>
    <path d="M1030 160 C 1090 160, 1100 230, 1160 230"/>
  </g>
  <g fill="#0B1220" stroke-width="2">
    <rect x="840" y="80" width="40" height="40" rx="10" stroke="#60A5FA"/>
    <rect x="840" y="200" width="40" height="40" rx="10" stroke="#60A5FA"/>
    <rect x="1006" y="136" width="48" height="48" rx="12" stroke="url(#accent)" stroke-width="3"/>
    <rect x="1160" y="70" width="40" height="40" rx="10" stroke="#2DD4BF"/>
    <rect x="1160" y="210" width="40" height="40" rx="10" stroke="#2DD4BF"/>
  </g>
  <circle cx="1030" cy="160" r="8" fill="url(#accent)"/>
  <circle cx="860" cy="100" r="5" fill="#60A5FA"/>
  <circle cx="860" cy="220" r="5" fill="#60A5FA"/>
  <circle cx="1180" cy="90" r="5" fill="#2DD4BF"/>
  <circle cx="1180" cy="230" r="5" fill="#2DD4BF"/>
  <!-- text -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="80" y="92" width="48" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="78" y="170" font-size="72" font-weight="700" fill="#F8FAFC" letter-spacing="-1.5">Rimora</text>
    <text x="80" y="214" font-size="24" fill="#CBD5E1">Automation, karyawan AI, dan skill siap pakai untuk bisnis.</text>
    <text x="80" y="252" font-size="16" fill="#64748B" letter-spacing="2">GRATIS &amp; PREMIUM  ·  DIBANGUN DI INDONESIA</text>
  </g>
</svg>
